const stories=[
['रोमांच','खोया हुआ किला','🏔️','#344d50','पहाड़ों के पीछे छिपा एक अनजान रास्ता।',`मीरा को अपने दादा की पुरानी डायरी में एक नक्शा मिला। नक्शे पर लाल स्याही से लिखा था—जहाँ नदी गायब होती है, वहीं से यात्रा शुरू होती है।\nअगली सुबह वह अपने मित्र अर्जुन के साथ पहाड़ों की ओर निकल पड़ी। नदी एक विशाल चट्टान के नीचे समा रही थी। उसके किनारे पत्थरों की सीढ़ियाँ थीं। दोनों मशाल जलाकर नीचे उतरे।\nसुरंग के अंत में एक उजड़ा किला था। अचानक जमीन हिलने लगी। अर्जुन ने दीवार पर बने सूर्य के निशान को दबाया और बाहर निकलने का दरवाजा खुल गया। भीतर सोने के बजाय प्राचीन पुस्तकों से भरा कमरा मिला।\nमीरा ने समझा कि असली खजाना ज्ञान था। दोनों ने वापस लौटकर इतिहासकारों को इसकी सूचना दी। उनके छोटे से सफर ने दुनिया के सामने एक भूला हुआ इतिहास खोल दिया।`],
['डरावनी','आधी रात का दरवाजा','👻','#412b48','हर रात ठीक बारह बजे कोई दस्तक देता था।',`रवि ने गाँव के बाहर एक पुराना मकान किराए पर लिया। पहली रात ठीक बारह बजे दरवाजे पर तीन दस्तक हुईं। बाहर कोई नहीं था।\nदूसरी रात दस्तक के साथ एक आवाज आई—मेरी चाबी लौटा दो। रवि ने सुबह कमरे की अलमारी हटाई। पीछे एक जंग लगी चाबी और छोटी बच्ची की तस्वीर मिली।\nगाँव की बुजुर्ग महिला ने बताया कि वर्षों पहले वहाँ एक परिवार रहता था। उनकी बेटी अपनी माँ की निशानी ढूँढ़ते हुए लापता हो गई थी।\nरवि ने चाबी तस्वीर के पास रख दी। उस रात फिर दस्तक हुई। दरवाजा अपने आप खुला और हवा में धीमी सी धन्यवाद की आवाज गूँजी। उसके बाद मकान शांत हो गया। मगर तस्वीर में बच्ची अब मुस्कुरा रही थी।`],
['प्रेम','बारिश वाली मुलाकात','🌧️','#674052','एक छतरी और दो अजनबियों की कहानी।',`दिल्ली की बारिश में नंदिनी बस का इंतजार कर रही थी। तभी कबीर ने अपनी छतरी उसकी ओर बढ़ाई। दोनों ने पास की दुकान पर चाय पी और अपने सपनों के बारे में बातें कीं।\nअगले कई महीनों तक वे उसी दुकान पर मिलते रहे। फिर नंदिनी को दूसरे शहर में नौकरी मिली। कबीर ने उसे रोकने के बजाय उसके सपनों का साथ दिया।\nदूरी के बावजूद दोनों पत्र लिखते रहे। दो साल बाद नंदिनी वापस आई। बारिश हो रही थी और कबीर उसी दुकान के सामने खड़ा था।\nनंदिनी ने अपनी छतरी खोलकर कहा—इस बार साथ चलोगे? कबीर मुस्कुराया। दोनों जानते थे कि उनका प्यार मुलाकातों से नहीं, एक दूसरे पर भरोसे से बना था।`],
['रहस्य','बंद कमरे का राज','🔎','#41405e','एक चिट्ठी जिसने सब कुछ बदल दिया।',`अनया को अपने नाना के बंद कमरे से घड़ी की आवाज सुनाई दी। कमरे की चाबी वर्षों से गायब थी। उसने खिड़की के पास एक छोटी चिट्ठी देखी।\nचिट्ठी में लिखा था कि समय को पीछे करो। अनया ने बरामदे की पुरानी घड़ी की सुइयाँ उलटी घुमाईं। घड़ी के नीचे छिपी चाबी गिर पड़ी।\nकमरे में उसे गाँव की जमीन के असली दस्तावेज मिले। कोई उन्हें नष्ट करके गाँव वालों की जमीन हड़पना चाहता था।\nअनया ने दस्तावेज सुरक्षित अधिकारियों को सौंपे। गाँव बच गया। नाना का रहस्य आखिरकार सबके काम आया।`],
['प्रेरणादायक','एक और कोशिश','🌅','#735134','हार के बाद भी सपने जीवित रहते हैं।',`अमन दौड़ की प्रतियोगिता में लगातार तीन बार हार चुका था। उसने जूते रख दिए और सोचा कि अब कभी नहीं दौड़ेगा।\nउसकी बहन ने पूछा—क्या जीतना ही तुम्हें दौड़ना सिखाता है? अमन ने फिर अभ्यास शुरू किया, इस बार अपनी गति और स्वास्थ्य पर ध्यान देते हुए।\nअगली प्रतियोगिता में वह दूसरे स्थान पर आया। उसे पहली बार अपनी मेहनत पर गर्व हुआ।\nउसने गाँव के बच्चों को दौड़ना सिखाना शुरू किया। उसके लिए सफलता अब केवल पदक नहीं, हर दिन थोड़ा आगे बढ़ना था।`],
['नैतिक','ईमानदारी का फल','🌳','#354d38','एक छोटे से फैसले की बड़ी सीख।',`गौरी को बाजार में सिक्कों से भरी थैली मिली। घर में पैसों की जरूरत थी, फिर भी उसने थैली अपने पास नहीं रखी।\nउसने दुकानदारों से पूछा और आखिर एक परेशान बुजुर्ग को ढूँढ़ लिया। बुजुर्ग ने थैली पहचान ली। वह अपनी दवा खरीदने आया था।\nउसने गौरी को इनाम देना चाहा, लेकिन गौरी ने केवल आशीर्वाद माँगा।\nउस दिन गौरी ने जाना कि ईमानदारी का सबसे बड़ा फल मन की शांति है।`]];
stories.push(...[["रोमांच", "नीली झील का नक्शा", "🗺️", "#23565e", "पहाड़ों के बीच छिपा रास्ता।", "मीरा को दादी की डायरी में नीली झील का नक्शा मिला। वह अपने भाई के साथ पहाड़ पर पहुँची तो रास्ते का पुल टूट चुका था।\nदोनों ने लौटने का फैसला किया, लेकिन पास की पहाड़ी से सहायता की पुकार सुनाई दी। एक चरवाहा घायल था। उन्होंने बचाव दल को बुलाया और उसके साथ इंतजार किया।\nचरवाहे ने उन्हें सुरक्षित रास्ता बताया। झील के किनारे दादी का नाम एक पुराने पत्थर पर लिखा था। मीरा समझ गई कि असली विरासत खजाना नहीं, साहस और दया थी।"], ["डरावनी", "खाली स्टेशन", "🚉", "#392d50", "आखिरी रेल का इंतजार।", "रात में रवि एक सुनसान स्टेशन पर उतरा। टिकटघर में रखा रेडियो उसका नाम पुकार रहा था।\nदीवार पर तीस साल पुरानी दुर्घटना की खबर लगी थी। तस्वीर में खड़ा स्टेशन मास्टर ठीक उसी आदमी जैसा था जो अभी लालटेन लेकर आया था।\nउसने रवि को पटरी से पीछे खींचा। एक मालगाड़ी अंधेरे से निकल गई। रवि ने धन्यवाद देने के लिए मुड़कर देखा, लेकिन वहाँ केवल बुझी लालटेन थी।"], ["प्रेम", "कागज की नाव", "💌", "#754556", "बचपन की यादों से जन्मा प्यार।", "सिया हर बरसात में कागज की नाव बनाती थी। एक दिन उसकी नाव के भीतर किसी ने उत्तर लिखकर लौटा दिया।\nवह लेखनी उसके बचपन के मित्र नील की थी। वर्षों बाद वह शहर लौटा था और पुराने मोहल्ले में पुस्तकालय खोल रहा था।\nदोनों ने मिलकर बच्चों के लिए किताबें जुटाईं। उद्घाटन के दिन नील ने सिया को एक नाव दी। उसमें लिखा था—क्या हम अपनी अगली कहानी साथ लिखें? सिया ने मुस्कुराकर हाँ कहा।"], ["रहस्य", "गायब तस्वीर", "🖼️", "#43455d", "संग्रहालय का अनोखा सुराग।", "संग्रहालय से एक तस्वीर गायब हुई, मगर दरवाजे बंद थे। इरा ने दीवार पर धूल का चौकोर निशान देखा।\nउसने पुराने रजिस्टर में पाया कि तस्वीर की मरम्मत का आदेश नकली था। चौकीदार के पास रखे डिब्बे पर वही नंबर लिखा था।\nपुलिस ने डिब्बे से तस्वीर बरामद की। चौकीदार को धोखा देकर एक नकली कर्मचारी उसे बाहर भेजने वाला था। इरा की सावधानी ने चोरी रोक दी।"], ["कल्पना", "चाँद का बीज", "🌙", "#30456c", "एक बगीचा जो रात में चमकता था।", "तारा को आँगन में चाँदी जैसा बीज मिला। उसने उसे मिट्टी में बोया। रात होते ही पौधे से छोटे सितारे निकलने लगे।\nएक बूढ़ी चिड़िया ने बताया कि पौधे को पानी नहीं, कोई अच्छी याद चाहिए। तारा ने माँ की हँसी याद की और शाखाएँ चमक उठीं।\nउसने पड़ोस के उदास बच्चों को बुलाया। सबकी यादों से बगीचा जगमगा गया। सुबह पौधा गायब था, लेकिन बच्चों के चेहरों पर खुशी बाकी थी।"], ["थ्रिलर", "सात मिनट", "⏳", "#674238", "एक चेतावनी और समय की दौड़।", "आरुष को फोन पर संदेश मिला कि सात मिनट में पुराने पुल पर खतरा होगा। उसने तत्काल पुलिस को सूचना दी।\nकैमरे में एक ट्रक गलत दिशा से आता दिखाई दिया। पुलिस ने सड़क बंद कर दी। ट्रक के ब्रेक खराब थे। चालक ने खाली मैदान की ओर वाहन मोड़कर उसे रोक लिया।\nसंदेश भेजने वाली पास की दुकान की कर्मचारी थी जिसने चालक की मदद की पुकार सुनी थी। आरुष ने जाना कि सही समय पर दी गई सूचना कई जानें बचा सकती है।"]]);

const words=s=>s[5].trim().split(/\s+/u).length; const isLong=s=>words(s)>=2000&&words(s)<=4000; document.getElementById('collectionInfo').textContent=`${stories.length} कहानियाँ · ${stories.filter(isLong).length}/100 लंबी कहानियाँ तैयार`; let historyList=[];try{historyList=JSON.parse(localStorage.getItem('kahaani_history')||'[]')}catch(e){};let category='सभी',saved=[];try{saved=JSON.parse(localStorage.getItem('kahaani_saved')||'[]')}catch(e){};const cats=['सभी','लंबी कहानियाँ','छोटी कहानियाँ','रोमांच','डरावनी','प्रेम','रहस्य','प्रेरणादायक','नैतिक','कल्पना','थ्रिलर','इतिहास'];function filter(c){category=c;render()}function render(){document.getElementById('filters').innerHTML=cats.map(c=>`<button class="${category===c?'active':''}" onclick="filter('${c}')">${c}</button>`).join('');let q=document.getElementById('search').value.trim();let items=stories.map((s,i)=>({s,i})).filter(({s,i})=>(category==='सभी'||(category==='लंबी कहानियाँ'&&isLong(s))||(category==='छोटी कहानियाँ'&&words(s)<2000)||category===s[0]||(category==='इतिहास'&&historyList.includes(i))||(category==='saved'&&saved.includes(i)))&&s.join(' ').includes(q));document.getElementById('grid').innerHTML=items.map(({s,i})=>`<section class="story"><div class="cover" style="background:linear-gradient(135deg,${s[3]},#171322)">${s[2]}</div><div class="info"><span class="tag">${s[0]} · ${words(s)} शब्द · लगभग ${Math.max(1,Math.ceil(words(s)/180))} मिनट</span><h3>${s[1]}</h3><p class="muted">${s[4]}</p><div class="actions"><button class="primary" onclick="read(${i})">पढ़ें →</button><button aria-label="संग्रह में रखें" onclick="save(${i})">${saved.includes(i)?'♥':'♡'}</button></div></div></section>`).join('')||(category==='लंबी कहानियाँ'?'<p>लंबी कहानियों का संग्रह अभी तैयार हो रहा है। छोटी कहानियाँ पढ़ने के लिए सभी चुनें।</p>':'<p>कोई कहानी नहीं मिली।</p>')}function save(i){saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];try{localStorage.setItem('kahaani_saved',JSON.stringify(saved))}catch(e){}render();if(!document.getElementById('reader').hidden)document.getElementById('saveRead').textContent=saved.includes(i)?'♥ संग्रह में है':'♡ संग्रह में रखें'}function home(){stopSpeech();document.getElementById('reader').hidden=true;document.getElementById('home').hidden=false;window.scrollTo(0,0)}function read(i){stopSpeech();historyList=[i,...historyList.filter(x=>x!==i)];try{localStorage.setItem('kahaani_history',JSON.stringify(historyList))}catch(e){};let s=stories[i];document.getElementById('home').hidden=true;let r=document.getElementById('reader');r.hidden=false;r.innerHTML=`<button onclick="home()">← सभी कहानियाँ</button><div class="cover" style="margin-top:20px;border-radius:18px;background:${s[3]}">${s[2]}</div><span class="tag">${s[0]} · ${words(s)} शब्द · लगभग ${Math.max(1,Math.ceil(words(s)/180))} मिनट</span><h1>${s[1]}</h1><button id="saveRead" onclick="save(${i})">${saved.includes(i)?'♥ संग्रह में है':'♡ संग्रह में रखें'}</button><div><button onclick="speakStory(${i})">🔊 कहानी सुनें</button> <button onclick="stopSpeech()">रोकें</button></div>${s[5].split('\n').map(p=>`<p>${p}</p>`).join('')}<button class="primary" onclick="read(${(i+1)%stories.length})">अगली कहानी →</button>`;window.scrollTo(0,0)}let speechRun=0;function stopSpeech(){speechRun++;if(window.speechSynthesis)speechSynthesis.cancel()}function speakStory(i){if(!window.speechSynthesis){alert("इस ब्राउज़र में आवाज उपलब्ध नहीं है।");return}stopSpeech();const run=speechRun;const voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith("hi"));if(!voice){alert("हिंदी आवाज उपलब्ध नहीं है। अपने फोन की वाणी सेटिंग में हिंदी आवाज जोड़ें।");return}const chunks=(stories[i][1]+"। "+stories[i][5]).match(/[^।!?\n]+[।!?]?/gu)||[];let n=0;function next(){if(run!==speechRun||n>=chunks.length)return;const u=new SpeechSynthesisUtterance(chunks[n++]);u.lang="hi-IN";u.voice=voice;u.onend=next;speechSynthesis.speak(u)}next()}render();</script></body></html>

<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAHAANI — कहानियों की दुनिया</title><style>
*{box-sizing:border-box}body{margin:0;background:#100f16;color:#f7f1e8;font-family:system-ui,sans-serif;line-height:1.8}header{position:sticky;top:0;background:#15131e;z-index:3;border-bottom:1px solid #39313d;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px}strong.logo{font-size:25px;letter-spacing:4px;color:#f8b968}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#252131;border:1px solid #493c50;border-radius:30px;padding:8px 17px}button.active,button.primary{background:#f8b968;color:#21141a;border-color:#f8b968}main{max-width:1120px;margin:auto;padding:24px 5%}.hero{padding:55px 28px;background:radial-gradient(ellipse at 90% 20%,#794a42,transparent 60%),linear-gradient(120deg,#292039,#161522);border:1px solid #5a3c52;border-radius:24px}.hero h1{font-size:clamp(32px,6vw,65px);line-height:1.3;margin:10px 0}.muted{color:#c2b5c8}.eyebrow{color:#f8b968;font-weight:bold;letter-spacing:2px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}input{width:100%;padding:13px 18px;border:1px solid #493c50;border-radius:12px;background:#1f1c28;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}.story{background:#1d1926;border:1px solid #383044;border-radius:18px;overflow:hidden}.cover{height:150px;display:grid;place-items:center;font-size:66px}.info{padding:18px}.info h3{margin:6px 0;font-size:23px}.tag{color:#f8b968;font-size:13px}.actions{display:flex;gap:8px;justify-content:space-between;align-items:center}.reader{max-width:750px;margin:auto;padding:20px 5% 60px}.reader p{font-size:20px;line-height:2.1}.reader h1{font-size:36px}footer{text-align:center;padding:25px;color:#b5a6be;border-top:1px solid #39313d}body.light{background:#fff7e9;color:#28202c}body.light header,body.light .story,body.light button:not(.primary):not(.active){background:#f0e4d7;color:#28202c}body.light .muted{color:#665968}body.light .hero{color:#fff}body.light .hero .muted{color:#e9dbe9}body.light .tag{color:#93531b} [hidden]{display:none!important}
</style></head><body><header><strong class="logo" onclick="home()" style="cursor:pointer">KAHAANI</strong><div><button onclick="home();filter('saved')">♡ संग्रह</button> <button aria-label="रंग बदलें" onclick="document.body.classList.toggle('light')">◐</button></div></header><main id="home"><section class="hero"><span class="eyebrow">हर कहानी, एक नई दुनिया</span><h1>कहानियों में खो जाइए।</h1><p class="muted">रोमांच, डर, प्यार और रहस्य की अनोखी हिंदी कहानियाँ।</p><button class="primary" onclick="read(0)">आज की कहानी पढ़ें →</button></section><h2>अपनी पसंद की कहानी खोजें</h2><input id="search" placeholder="कहानी खोजें…" oninput="render()"><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main><article class="reader" id="reader" hidden></article><footer>KAHAANI © 2026 · हिंदी कहानियों का अपना संसार</footer><script>
const stories=[
['रोमांच','खोया हुआ किला','🏔️','#344d50','पहाड़ों के पीछे छिपा एक अनजान रास्ता।',`मीरा को अपने दादा की पुरानी डायरी में एक नक्शा मिला। नक्शे पर लाल स्याही से लिखा था—जहाँ नदी गायब होती है, वहीं से यात्रा शुरू होती है।\nअगली सुबह वह अपने मित्र अर्जुन के साथ पहाड़ों की ओर निकल पड़ी। नदी एक विशाल चट्टान के नीचे समा रही थी। उसके किनारे पत्थरों की सीढ़ियाँ थीं। दोनों मशाल जलाकर नीचे उतरे।\nसुरंग के अंत में एक उजड़ा किला था। अचानक जमीन हिलने लगी। अर्जुन ने दीवार पर बने सूर्य के निशान को दबाया और बाहर निकलने का दरवाजा खुल गया। भीतर सोने के बजाय प्राचीन पुस्तकों से भरा कमरा मिला।\nमीरा ने समझा कि असली खजाना ज्ञान था। दोनों ने वापस लौटकर इतिहासकारों को इसकी सूचना दी। उनके छोटे से सफर ने दुनिया के सामने एक भूला हुआ इतिहास खोल दिया।`],
['डरावनी','आधी रात का दरवाजा','👻','#412b48','हर रात ठीक बारह बजे कोई दस्तक देता था।',`रवि ने गाँव के बाहर एक पुराना मकान किराए पर लिया। पहली रात ठीक बारह बजे दरवाजे पर तीन दस्तक हुईं। बाहर कोई नहीं था।\nदूसरी रात दस्तक के साथ एक आवाज आई—मेरी चाबी लौटा दो। रवि ने सुबह कमरे की अलमारी हटाई। पीछे एक जंग लगी चाबी और छोटी बच्ची की तस्वीर मिली।\nगाँव की बुजुर्ग महिला ने बताया कि वर्षों पहले वहाँ एक परिवार रहता था। उनकी बेटी अपनी माँ की निशानी ढूँढ़ते हुए लापता हो गई थी।\nरवि ने चाबी तस्वीर के पास रख दी। उस रात फिर दस्तक हुई। दरवाजा अपने आप खुला और हवा में धीमी सी धन्यवाद की आवाज गूँजी। उसके बाद मकान शांत हो गया। मगर तस्वीर में बच्ची अब मुस्कुरा रही थी।`],
['प्रेम','बारिश वाली मुलाकात','🌧️','#674052','एक छतरी और दो अजनबियों की कहानी।',`दिल्ली की बारिश में नंदिनी बस का इंतजार कर रही थी। तभी कबीर ने अपनी छतरी उसकी ओर बढ़ाई। दोनों ने पास की दुकान पर चाय पी और अपने सपनों के बारे में बातें कीं।\nअगले कई महीनों तक वे उसी दुकान पर मिलते रहे। फिर नंदिनी को दूसरे शहर में नौकरी मिली। कबीर ने उसे रोकने के बजाय उसके सपनों का साथ दिया।\nदूरी के बावजूद दोनों पत्र लिखते रहे। दो साल बाद नंदिनी वापस आई। बारिश हो रही थी और कबीर उसी दुकान के सामने खड़ा था।\nनंदिनी ने अपनी छतरी खोलकर कहा—इस बार साथ चलोगे? कबीर मुस्कुराया। दोनों जानते थे कि उनका प्यार मुलाकातों से नहीं, एक दूसरे पर भरोसे से बना था।`],
['रहस्य','बंद कमरे का राज','🔎','#41405e','एक चिट्ठी जिसने सब कुछ बदल दिया।',`अनया को अपने नाना के बंद कमरे से घड़ी की आवाज सुनाई दी। कमरे की चाबी वर्षों से गायब थी। उसने खिड़की के पास एक छोटी चिट्ठी देखी।\nचिट्ठी में लिखा था कि समय को पीछे करो। अनया ने बरामदे की पुरानी घड़ी की सुइयाँ उलटी घुमाईं। घड़ी के नीचे छिपी चाबी गिर पड़ी।\nकमरे में उसे गाँव की जमीन के असली दस्तावेज मिले। कोई उन्हें नष्ट करके गाँव वालों की जमीन हड़पना चाहता था।\nअनया ने दस्तावेज सुरक्षित अधिकारियों को सौंपे। गाँव बच गया। नाना का रहस्य आखिरकार सबके काम आया।`],
['प्रेरणादायक','एक और कोशिश','🌅','#735134','हार के बाद भी सपने जीवित रहते हैं।',`अमन दौड़ की प्रतियोगिता में लगातार तीन बार हार चुका था। उसने जूते रख दिए और सोचा कि अब कभी नहीं दौड़ेगा।\nउसकी बहन ने पूछा—क्या जीतना ही तुम्हें दौड़ना सिखाता है? अमन ने फिर अभ्यास शुरू किया, इस बार अपनी गति और स्वास्थ्य पर ध्यान देते हुए।\nअगली प्रतियोगिता में वह दूसरे स्थान पर आया। उसे पहली बार अपनी मेहनत पर गर्व हुआ।\nउसने गाँव के बच्चों को दौड़ना सिखाना शुरू किया। उसके लिए सफलता अब केवल पदक नहीं, हर दिन थोड़ा आगे बढ़ना था।`],
['नैतिक','ईमानदारी का फल','🌳','#354d38','एक छोटे से फैसले की बड़ी सीख।',`गौरी को बाजार में सिक्कों से भरी थैली मिली। घर में पैसों की जरूरत थी, फिर भी उसने थैली अपने पास नहीं रखी।\nउसने दुकानदारों से पूछा और आखिर एक परेशान बुजुर्ग को ढूँढ़ लिया। बुजुर्ग ने थैली पहचान ली। वह अपनी दवा खरीदने आया था।\nउसने गौरी को इनाम देना चाहा, लेकिन गौरी ने केवल आशीर्वाद माँगा।\nउस दिन गौरी ने जाना कि ईमानदारी का सबसे बड़ा फल मन की शांति है।`]];
let category='सभी',saved=[];try{saved=JSON.parse(localStorage.getItem('kahaani_saved')||'[]')}catch(e){};const cats=['सभी','रोमांच','डरावनी','प्रेम','रहस्य','प्रेरणादायक','नैतिक'];function filter(c){category=c;render()}function render(){document.getElementById('filters').innerHTML=cats.map(c=>`<button class="${category===c?'active':''}" onclick="filter('${c}')">${c}</button>`).join('');let q=document.getElementById('search').value.trim();let items=stories.map((s,i)=>({s,i})).filter(({s,i})=>(category==='सभी'||category===s[0]||(category==='saved'&&saved.includes(i)))&&s.join(' ').includes(q));document.getElementById('grid').innerHTML=items.map(({s,i})=>`<section class="story"><div class="cover" style="background:linear-gradient(135deg,${s[3]},#171322)">${s[2]}</div><div class="info"><span class="tag">${s[0]}</span><h3>${s[1]}</h3><p class="muted">${s[4]}</p><div class="actions"><button class="primary" onclick="read(${i})">पढ़ें →</button><button aria-label="संग्रह में रखें" onclick="save(${i})">${saved.includes(i)?'♥':'♡'}</button></div></div></section>`).join('')||'<p>कोई कहानी नहीं मिली।</p>'}function save(i){saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];try{localStorage.setItem('kahaani_saved',JSON.stringify(saved))}catch(e){}render();if(!document.getElementById('reader').hidden)document.getElementById('saveRead').textContent=saved.includes(i)?'♥ संग्रह में है':'♡ संग्रह में रखें'}function home(){document.getElementById('reader').hidden=true;document.getElementById('home').hidden=false;window.scrollTo(0,0)}function read(i){let s=stories[i];document.getElementById('home').hidden=true;let r=document.getElementById('reader');r.hidden=false;r.innerHTML=`<button onclick="home()">← सभी कहानियाँ</button><div class="cover" style="margin-top:20px;border-radius:18px;background:${s[3]}">${s[2]}</div><span class="tag">${s[0]}</span><h1>${s[1]}</h1><button id="saveRead" onclick="save(${i})">${saved.includes(i)?'♥ संग्रह में है':'♡ संग्रह में रखें'}</button>${s[5].split('\n').map(p=>`<p>${p}</p>`).join('')}<button class="primary" onclick="read(${(i+1)%stories.length})">अगली कहानी →</button>`;window.scrollTo(0,0)}render();</script></body></html>
